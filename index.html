<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Carte Emprunts ICOM</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Style de la carte -->
  <style>
    #map {
      width: 100%;
      height: 500px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    .popup-custom {
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Grist JS -->
  <script src="https://unpkg.com/grist-static@latest/dist/grist.js"></script>

  <script>
    // Attend que Grist soit prêt
    Grist.ready(() => {
      // Récupère les données de la table EmpruntsCartes
      Grist.fetchSelectedTable().then((emprunts) => {
        initMap(emprunts);
      });
    });

    function initMap(emprunts) {
      // Centre par défaut (ajuste selon tes besoins)
      const defaultCenter = [46.603354, 1.888334]; // Centre de la France
      const map = L.map('map').setView(defaultCenter, 6);

      // Ajoute la couche OpenStreetMap
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      }).addTo(map);

      // Ajoute les marqueurs
      emprunts.forEach((emprunt) => {
        // Vérifie que les coordonnées existent
        if (emprunt.Latitude && emprunt.Longitude) {
          const marker = L.marker([emprunt.Latitude, emprunt.Longitude]).addTo(map);

          // Contenu du popup (adapte selon tes colonnes)
          const popupContent = `
            <div class="popup-custom">
              <b>${emprunt.Emprunteur || 'Emprunteur inconnu'}</b><br>
              Date d'emprunt: ${emprunt.DateEmprunt || 'N/A'}<br>
              ${emprunt.Commentaire ? `Commentaire: ${emprunt.Commentaire}` : ''}
            </div>
          `;
          marker.bindPopup(popupContent);
        }
      });
    }
  </script>
</body>
</html>
